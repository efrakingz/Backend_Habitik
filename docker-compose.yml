version: '3.8'

services:
  postgres_local:
    image: postgres:16-alpine
    container_name: habitik_postgres_local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: habitik_local
    ports:
      - "5432:5432"
    volumes:
      - habitik_pgdata:/var/lib/postgresql/data
      - ./database/init_local_db.sql:/docker-entrypoint-initdb.d/init_local_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habitik_local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  habitik_pgdata:
    driver: local
